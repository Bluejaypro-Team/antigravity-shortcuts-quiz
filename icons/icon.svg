<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E131F"/>
      <stop offset="50%" stop-color="#07090E"/>
      <stop offset="100%" stop-color="#121826"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#6366F1" flood-opacity="0.35"/>
    </filter>
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#10B981" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="8"/>

  <!-- Center tactile keycap container -->
  <g transform="translate(96, 96)">
    <!-- Base keycap 3D shadow -->
    <rect width="320" height="280" rx="36" fill="#0A0E17" y="40"/>
    <rect width="320" height="280" rx="36" fill="url(#accentGrad)" filter="url(#shadow)"/>
    <rect width="316" height="276" x="2" y="2" rx="34" fill="none" stroke="rgba(255,255,255,0.24)" stroke-width="4"/>

    <!-- Inner key cap face -->
    <rect width="280" height="240" x="20" y="20" rx="24" fill="#0D121F" fill-opacity="0.9"/>
    <rect width="276" height="236" x="22" y="22" rx="22" fill="none" stroke="rgba(99,102,241,0.3)" stroke-width="2"/>

    <!-- Antigravity Delta Symbol + Shortcut Key Motif -->
    <path d="M160 64 L220 180 L100 180 Z" fill="none" stroke="url(#accentGrad)" stroke-width="18" stroke-linejoin="round"/>
    <circle cx="160" cy="142" r="14" fill="#06B6D4" filter="url(#emeraldGlow)"/>

    <!-- Keycap label "AG" -->
    <text x="160" y="228" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="700" fill="#F3F4F6" text-anchor="middle" letter-spacing="4">AG // CTRL</text>
  </g>

  <!-- Emerald NotebookLM Learning Indicator Sparkle -->
  <g transform="translate(372, 88)" filter="url(#emeraldGlow)">
    <circle cx="20" cy="20" r="18" fill="#10B981"/>
    <path d="M20 8 L23 17 L32 20 L23 23 L20 32 L17 23 L8 20 L17 17 Z" fill="#FFFFFF"/>
  </g>
</svg>
